<section id="capabilities" class="section-padding bg-gradient-to-br from-slate-50 to-primary-50/30">
  <div class="max-w-7xl mx-auto">

    <!-- Section Header -->
    <div class="text-center mb-16">
      <span class="inline-block px-4 py-1.5 bg-primary-50 text-primary-600 text-sm font-semibold rounded-full mb-4 uppercase tracking-wide">Our Commitment</span>
      <h2 class="section-title gradient-text">How We Work With You</h2>
      <p class="section-subtitle">
        The process behind every project — from the first conversation to long after launch.
      </p>
    </div>

    <!-- Features Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let feature of features; let i = index"
           class="relative overflow-hidden p-8 rounded-2xl border border-gray-100 bg-white shadow-sm card-hover-brand hover:-translate-y-1 hover:border-primary-100 transition-all duration-300 group">

        <!-- Top accent bar, sweeps in on hover -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-card-gradient scale-x-0 group-hover:scale-x-100 origin-left transition-transform duration-300"></div>

        <!-- Soft tint wash on hover -->
        <div class="absolute inset-0 bg-gradient-to-br from-primary-50/70 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

        <div class="relative">
          <span class="absolute top-0 right-0 font-display text-sm font-bold text-gray-200 group-hover:text-primary-200 transition-colors duration-300">
            {{ (i + 1) < 10 ? '0' + (i + 1) : i + 1 }}
          </span>
          <div class="w-12 h-12 rounded-xl bg-card-gradient flex items-center justify-center mb-5 shadow-md shadow-primary-500/25 group-hover:scale-110 group-hover:rotate-3 transition-all duration-300">
            <span class="material-icons text-white text-xl" aria-hidden="true">{{ feature.icon }}</span>
          </div>
          <h4 class="font-bold text-gray-900 mb-3 text-lg group-hover:gradient-text transition-all duration-300">{{ feature.title }}</h4>
          <p class="text-gray-500 text-sm leading-relaxed">{{ feature.desc }}</p>
        </div>
      </div>
    </div>

    <!-- Bottom CTA -->
    <div class="text-center mt-14">
      <p class="text-gray-500 mb-6 text-lg">Ready to see how we'd run your project?</p>
      <a href="#contact"
         (click)="$event.preventDefault(); scrollTo('contact')"
         class="btn-gradient inline-flex text-base">
        Let's Talk
        <span class="material-icons" aria-hidden="true">arrow_forward</span>
      </a>
    </div>

  </div>
</section>
