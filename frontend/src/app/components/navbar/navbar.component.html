<nav [class]="isScrolled
    ? 'fixed top-0 left-0 w-full z-50 transition-all duration-300 bg-white/95 backdrop-blur-md shadow-lg border-b border-gray-100'
    : 'fixed top-0 left-0 w-full z-50 transition-all duration-300 bg-transparent border-b border-transparent'">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-16">
    <div class="flex items-center justify-between h-[4.5rem]">

      <!-- Logo -->
      <a href="#home" (click)="scrollTo('#home', $event)" class="flex items-center gap-2 group">
        <img [src]="isScrolled ? 'assets/images/infort_new_logo.png' : 'assets/images/infort_new_logo_white.png'" alt="Infort Logo"
          class="h-8 transition-all duration-300" />
      </a>

      <!-- Desktop Nav Links -->
      <div class="hidden lg:flex items-center gap-1 font-display">
        <a *ngFor="let link of navLinks"
           [href]="link.href"
           (click)="scrollTo(link.href, $event)"
           [class]="navLinkClasses(link)">
          {{ link.label }}
        </a>
      </div>

      <!-- Desktop CTA -->
      <div class="hidden lg:flex items-center gap-3">
        <a href="#contact" (click)="scrollTo('#contact', $event)"
          class="btn-gradient text-base font-semibold py-2.5 px-6 flex items-center gap-2">
          Get Started
          <span class="material-icons text-base">arrow_forward</span>
        </a>
      </div>

      <!-- Mobile Hamburger -->
      <button (click)="toggleMobileMenu()"
              [class]="isScrolled ? 'lg:hidden p-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors' : 'lg:hidden p-2 rounded-lg text-white hover:bg-white/10 transition-colors'"
              aria-label="Toggle mobile menu">
        <span class="material-icons text-2xl">{{ isMobileMenuOpen ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMobileMenuOpen"
       class="lg:hidden bg-white/98 backdrop-blur-md border-t border-gray-100 shadow-xl">
    <div class="px-4 py-4 flex flex-col gap-1 font-display">
      <a *ngFor="let link of navLinks"
         [href]="link.href"
         (click)="scrollTo(link.href, $event)"
         [class]="mobileNavLinkClasses(link)">
        {{ link.label }}
      </a>
      <div class="pt-3 border-t border-gray-100 mt-2">
        <a href="#contact" (click)="scrollTo('#contact', $event)"
           class="btn-gradient w-full justify-center text-sm py-3">
          Get Started
          <span class="material-icons text-base">arrow_forward</span>
        </a>
      </div>
    </div>
  </div>
</nav>
