<section id="home" class="relative min-h-screen flex items-center overflow-hidden bg-hero-gradient">

  <!-- Animated Background Orbs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-primary-500/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute top-1/2 right-1/4 w-96 h-96 bg-primary-600/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
    <div class="absolute bottom-1/4 left-1/2 w-64 h-64 bg-primary-400/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>
    <!-- Soft radial glow for depth -->
    <div class="absolute inset-0" style="background: radial-gradient(ellipse 60% 50% at 50% 20%, rgba(248,113,113,0.15), transparent 70%);"></div>
    <!-- Light line grid -->
    <div class="absolute inset-0 hero-grid-lines"></div>
  </div>

  <div class="relative z-10 max-w-7xl mx-auto px-6 sm:px-8 lg:px-16 xl:px-20 w-full py-28 lg:py-36">
    <div class="flex flex-col items-center text-center max-w-5xl mx-auto animate-slide-up">

      <!-- Eyebrow badge -->
      <div class="inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/5 backdrop-blur-sm px-4 py-1.5 mb-7 text-xs font-semibold uppercase tracking-wider text-white/80">
        <span class="relative flex h-2 w-2">
          <span class="absolute inline-flex h-full w-full rounded-full bg-primary-400 animate-ping"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-primary-400"></span>
        </span>
        Technology &amp; Growth Partner
      </div>

      <!-- Headline: one bold statement built to earn trust on first impression -->
      <h1 class="text-4xl sm:text-5xl lg:text-6xl xl:text-7xl font-bold text-white leading-tight mb-6 text-balance drop-shadow-sm">
        Businesses
        <span class="bg-text-gradient-light bg-clip-text text-transparent">Trust Infort</span>
        to Build, Market &amp; Grow
      </h1>

      <!-- Subtitle -->
      <p class="text-base sm:text-lg text-white/70 leading-relaxed mb-10 max-w-2xl mx-auto text-balance">
        One dedicated team delivering technology and marketing solutions that help businesses launch, grow, and scale.
      </p>

      <!-- CTA Buttons -->
      <div class="flex flex-wrap justify-center gap-4 mb-14">
        <button (click)="scrollTo('services')" class="btn-gradient text-base py-3.5 px-8 shadow-2xl shadow-primary-500/30">
          Start Your Project
          <span class="material-icons" aria-hidden="true">rocket_launch</span>
        </button>
        <button (click)="scrollTo('contact')" class="btn-outline text-base py-3.5 px-8">
          Contact Us
          <span class="material-icons" aria-hidden="true">mail_outline</span>
        </button>
      </div>

      <!-- Stats Row -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-y-8 gap-x-8 sm:gap-x-0 w-full max-w-xl mx-auto sm:divide-x sm:divide-white/10">
        <div *ngFor="let stat of stats" class="text-center group px-2">
          <div class="font-display text-3xl font-bold text-white group-hover:scale-110 transition-transform duration-300">{{ stat.value }}</div>
          <div class="text-xs text-white/60 mt-1 font-medium uppercase tracking-wide">{{ stat.label }}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce">
    <div class="w-6 h-10 border-2 border-white/40 rounded-full flex justify-center pt-2">
      <div class="w-1 h-3 bg-white/60 rounded-full"></div>
    </div>
  </div>
</section>
