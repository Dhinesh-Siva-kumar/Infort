<section id="home" class="relative min-h-screen flex items-center overflow-hidden"
         style="background: linear-gradient(135deg, #1c0505 0%, #450a0a 40%, #7f1d1d 70%, #9f1239 100%);">

  <!-- Animated Background Orbs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-red-500/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute top-1/2 right-1/4 w-96 h-96 bg-rose-500/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
    <div class="absolute bottom-1/4 left-1/2 w-64 h-64 bg-red-400/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>
    <!-- Grid pattern -->
    <div class="absolute inset-0 opacity-5"
         style="background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px;"></div>
  </div>

  <div class="relative z-10 max-w-7xl mx-auto px-6 sm:px-8 lg:px-16 xl:px-20 w-full">
    <div class="flex flex-col items-center text-center max-w-5xl mx-auto py-28 lg:py-36 animate-slide-up">

      <!-- Headline: one bold statement built to earn trust on first impression -->
      <h1 class="text-4xl sm:text-5xl lg:text-6xl xl:text-7xl font-bold text-white leading-tight mb-6 text-balance">
        Businesses
        <span style="background: linear-gradient(135deg, #fca5a5, #fb7185, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Trust Infort</span>
        to Build, Market &amp; Grow
      </h1>

      <!-- Subtitle -->
      <p class="text-base sm:text-lg text-white/70 leading-relaxed mb-10 max-w-2xl mx-auto text-balance">
        One dedicated team delivering technology and marketing solutions that help businesses launch, grow, and scale.
      </p>

      <!-- CTA Buttons -->
      <div class="flex flex-wrap justify-center gap-4 mb-14">
        <button (click)="scrollTo('services')" class="btn-gradient text-base py-3.5 px-8 shadow-2xl shadow-red-500/30">
          Start Your Project
          <span class="material-icons">rocket_launch</span>
        </button>
        <button (click)="scrollTo('contact')" class="btn-outline text-base py-3.5 px-8">
          Contact Us
          <span class="material-icons">mail_outline</span>
        </button>
      </div>

      <!-- Stats Row -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-8 sm:gap-10 w-full max-w-xl mx-auto">
        <div *ngFor="let stat of stats" class="text-center group">
          <div class="font-display text-3xl font-bold text-white group-hover:scale-110 transition-transform duration-300">{{ stat.value }}</div>
          <div class="text-xs text-white/60 mt-1 font-medium uppercase tracking-wide">{{ stat.label }}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce">
    <div class="w-6 h-10 border-2 border-white/40 rounded-full flex justify-center pt-2">
      <div class="w-1 h-3 bg-white/60 rounded-full"></div>
    </div>
  </div>
</section>
