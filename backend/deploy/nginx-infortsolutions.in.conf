server {
    server_name infortsolutions.in www.infortsolutions.in;

    root /var/www/infortsolutions/Infort/dist/infort/browser;
    index index.html;

    # Backend API — proxied through on the same domain so the frontend can
    # call a same-origin /api/* path. proxy_pass has no trailing path here,
    # so Nginx forwards the request URI unchanged (e.g. /api/auth/login ->
    # http://127.0.0.1:3000/api/auth/login), matching the routes the backend
    # already mounts under /api (see backend/src/app.ts).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/infortsolutions.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/infortsolutions.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
