org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler cache can't compute relative paths across
# drive letters on Windows (project is on D:, the pub cache is on C:), which
# crashes compileDebugKotlin with "this and base files have different roots".
# Disabling incremental compilation avoids that path computation entirely.
kotlin.incremental=false
kotlin.incremental.android=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
