name: infortapp
description: "Infort — secure mobile dashboard for the Infort Solutions Founder/Owner."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Secure token storage (Android Keystore / iOS Keychain — never SharedPreferences)
  flutter_secure_storage: ^9.2.2

  # Routing / deep linking
  go_router: ^14.6.2

  # Non-sensitive local prefs (theme mode)
  shared_preferences: ^2.3.3

  # Platform integrations for contact actions (call/email/whatsapp)
  url_launcher: ^6.3.1

  # Network connectivity detection for offline handling
  connectivity_plus: ^6.1.0

  # Biometric unlock (optional, enabled by the user in Settings)
  local_auth: ^2.3.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/app_icon_foreground.png
