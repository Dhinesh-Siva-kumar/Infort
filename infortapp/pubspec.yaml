name: infortapp
description: "Infort Founder — secure mobile dashboard for the Infort Solutions Founder/Owner."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Secure token storage (Android Keystore / iOS Keychain — never SharedPreferences)
  flutter_secure_storage: ^9.2.2

  # Routing / deep linking
  go_router: ^14.6.2

  # Non-sensitive local prefs (theme mode)
  shared_preferences: ^2.3.3

  # Platform integrations for contact actions (call/email/whatsapp)
  url_launcher: ^6.3.1

  # Network connectivity detection for offline handling
  connectivity_plus: ^6.1.0

  # Biometric unlock (optional, enabled by the user in Settings)
  local_auth: ^2.3.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
